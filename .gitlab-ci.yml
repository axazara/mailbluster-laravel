image: registry.gitlab.com/axazara/package/laravel-docker/laravel-docker:8.3

stages:
  - Build
  - Code Quality
  - Test

# Build Stage - Install dependencies and cache them
composer:
  stage: Build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-composer
    paths:
      - vendor/
  script:
    - composer install --prefer-dist --no-progress --no-interaction
  artifacts:
    expire_in: 1 day
    paths:
      - vendor/

# Code Quality Stage - Run PHP CS Fixer
code-style:
  stage: Code Quality
  dependencies:
    - composer
  cache:
    key: ${CI_COMMIT_REF_SLUG}-composer
    paths:
      - vendor/
    policy: pull
  script:
    - vendor/bin/php-cs-fixer fix --dry-run --diff --verbose
  allow_failure: false

# Code Quality Stage - Run PHPStan
phpstan:
  stage: Code Quality
  dependencies:
    - composer
  cache:
    key: ${CI_COMMIT_REF_SLUG}-composer
    paths:
      - vendor/
    policy: pull
  script:
    - vendor/bin/phpstan analyse --no-progress --error-format=gitlab --memory-limit=1G > phpstan-report.json || true
  artifacts:
    when: always
    expire_in: 1 day
    reports:
      codequality: phpstan-report.json
    paths:
      - phpstan-report.json
  allow_failure: true

# Test Stage - Run PHPUnit tests
test:
  stage: Test
  dependencies:
    - composer
  cache:
    key: ${CI_COMMIT_REF_SLUG}-composer
    paths:
      - vendor/
    policy: pull
  script:
    - vendor/bin/phpunit --testdox
  allow_failure: false
